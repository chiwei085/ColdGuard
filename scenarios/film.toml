# Presentation cut of the main story. Same firmware rules, with waits cut
# from the video. story.toml stays the full run for acceptance and questions.
duration_ms = 398_000
snapshot_ms = 1000

[config]
ambient_c = 30.0
batches = 4

[config.fridge]
initial_c = 5.0
heat_capacity_j_per_k = 20_000.0
closed_w_per_k = 1.5
open_w_per_k = 15.0
cooling_w = 150.0
probe_tau_s = 60.0

[[caption]]
at_ms = 0
chapter = "1 / 6  Check-in"
text = "Every second the fridge, the box and the terminal report."
view = "clinic"

[[caption]]
at_ms = 3_000
text = "Badge first, then the batch tag. Time and staff are logged."
view = "terminal"

[[caption]]
at_ms = 8_000
text = "The other batches follow."
view = "clinic"
video_speed = 4.0

[[caption]]
at_ms = 16_000
text = "One batch is dispensed."
view = "clinic"

[[caption]]
at_ms = 21_000
chapter = "2 / 6  Outage"
text = "Power is cut. Cooling stops. Monitoring runs on battery."
view = "fridge"

[[caption]]
at_ms = 29_000
text = "Safe time cannot be trusted yet, so transport is advised."
view = "fridge"

[[caption]]
at_ms = 37_000
chapter = "3 / 6  Departure"
text = "Clinic B confirms it can receive. The box is checked first."
view = "carrier"

[[caption]]
at_ms = 41_000
text = "Refused. The box has not held 2 to 8 C for five minutes."
view = "carrier"

[[caption]]
at_ms = 47_000
text = "Each batch is scanned into the box."
view = "clinic"

[[caption]]
at_ms = 52_000
text = "VAX-02 and VAX-03 follow."
view = "clinic"
video_speed = 4.0

[[caption]]
at_ms = 60_000
text = ""
view = "carrier"
video_cut = true

[[caption]]
at_ms = 299_000
text = "Five minutes later. Every condition holds. Departure accepted."
view = "carrier"

[[caption]]
at_ms = 306_000
chapter = "4 / 6  Lost contact"
text = "On the way the box loses contact."
view = "box"

[[caption]]
at_ms = 310_000
text = "Three heartbeats missed."
view = "box"
video_speed = 6.0

[[caption]]
at_ms = 332_000
text = "The clinic marks the box offline at its last reading. The box keeps measuring and logging."
view = "box"

[[caption]]
at_ms = 340_000
text = "No contact, no proof. Use is refused."
view = "terminal"

[[caption]]
at_ms = 347_000
text = ""
view = "box"
video_cut = true

[[caption]]
at_ms = 362_000
chapter = "5 / 6  Handover"
text = "The box reaches Clinic B. Contact comes back."
view = "receiver"

[[caption]]
at_ms = 368_000
text = "Records missed offline upload with their original times."
view = "receiver"
video_speed = 3.0

[[caption]]
at_ms = 384_000
text = "The receiver signs. Each batch is accepted, then usable."
view = "receiver"
video_speed = 2.0

