# Normal work, door alarm, outage, transport, lost contact and handover.
# A warm day and a small fridge shorten the wait.
duration_ms = 437_000
snapshot_ms = 1000

[config]
ambient_c = 30.0
batches = 4

[config.fridge]
initial_c = 5.0
heat_capacity_j_per_k = 20_000.0
closed_w_per_k = 1.5
open_w_per_k = 15.0
cooling_w = 150.0
probe_tau_s = 60.0

[[caption]]
at_ms = 0
chapter = "1 / 5  Check-in"
text = "Morning delivery. Four batches wait on the counter."
view = "clinic"

[[caption]]
at_ms = 10_000
text = "Badge first, then each batch is scanned in."
view = "terminal"

[[caption]]
at_ms = 17_000
text = "Each confirmed batch moves to its shelf."
view = "clinic"

[[caption]]
at_ms = 30_000
text = "One batch is dispensed."
view = "clinic"

[[caption]]
at_ms = 36_000
chapter = "2 / 5  Door alarm"
text = "The door is left open."
view = "fridge"

[[caption]]
at_ms = 56_000
text = "Nobody notices. The fridge counts the seconds."
view = "clinic"

[[caption]]
at_ms = 74_000
text = "The alarm comes at 60 seconds."
view = "fridge"

[[caption]]
at_ms = 93_000
text = "Door alarm."
view = "fridge"

[[caption]]
at_ms = 101_000
text = "The door is closed. The alarm clears."
view = "fridge"

[[caption]]
at_ms = 110_000
chapter = "3 / 5  Outage"
text = "Power out. Cooling stops. Monitoring runs on battery. Keep the door closed."
view = "fridge"

[[caption]]
at_ms = 122_000
text = "Safe time runs short. Transport is advised."
view = "fridge"

[[caption]]
at_ms = 126_000
text = "Clinic B confirms it can receive."
view = "carrier"

[[caption]]
at_ms = 134_000
text = "Departure refused. The box is not stable yet."
view = "carrier"

[[caption]]
at_ms = 150_000
text = "Meanwhile each batch is scanned into the box."
view = "clinic"

[[caption]]
at_ms = 170_000
text = "The box must hold 2 to 8 C for five minutes before it leaves."
view = "carrier"

[[caption]]
at_ms = 200_000
text = "The empty fridge warms without cooling. The batches left in time."
view = "fridge"

[[caption]]
at_ms = 225_000
text = "The box holds steady. Its countdown runs."
view = "carrier"

[[caption]]
at_ms = 245_000
text = "Still no mains. The monitor keeps watch on battery."
view = "fridge"

[[caption]]
at_ms = 262_000
text = "Less than a minute to go."
view = "carrier"

[[caption]]
at_ms = 280_000
text = "The fridge alarms stay on until power returns."
view = "fridge"

[[caption]]
at_ms = 292_000
text = "Almost there."
view = "carrier"

[[caption]]
at_ms = 304_000
chapter = "4 / 5  Transport"
text = "Every condition holds. Departure is accepted."
view = "carrier"

[[caption]]
at_ms = 309_000
text = "The box leaves with its three batches."
view = "box"

[[caption]]
at_ms = 316_000
text = "On the way the box loses contact. It keeps recording."
view = "box"

[[caption]]
at_ms = 343_000
text = "No contact, no proof. Use is refused."
view = "terminal"

[[caption]]
at_ms = 361_000
chapter = "5 / 5  Handover"
text = "The box reaches Clinic B."
view = "receiver"

[[caption]]
at_ms = 370_000
text = "Contact is back. Missed records follow in order."
view = "receiver"

[[caption]]
at_ms = 388_000
text = "The receiver signs for the box."
view = "receiver"

[[caption]]
at_ms = 399_000
text = "Use stays blocked until each batch is accepted."
view = "receiver"

[[caption]]
at_ms = 407_000
text = "The log is complete. Each batch is accepted."
view = "receiver"

[[caption]]
at_ms = 425_000
text = "All three batches arrived safe and fully recorded."
view = "receiver"

