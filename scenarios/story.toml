# Normal work, door alarm, outage, transport, lost contact and handover.
# A warm day and a small fridge shorten the wait.
duration_ms = 470_000
snapshot_ms = 1000

[config]
ambient_c = 30.0
batches = 4

[config.fridge]
initial_c = 5.0
heat_capacity_j_per_k = 20_000.0
closed_w_per_k = 1.5
open_w_per_k = 15.0
cooling_w = 150.0
probe_tau_s = 60.0

[[caption]]
at_ms = 0
text = "Morning delivery. Four batches wait on the counter."
view = "clinic"

[[caption]]
at_ms = 10_000
text = "The nurse shows a badge, then scans each batch into the fridge."
view = "terminal"

[[caption]]
at_ms = 17_000
text = "Each confirmed batch moves to its shelf."
view = "clinic"

[[caption]]
at_ms = 30_000
text = "One batch is dispensed."
view = "clinic"

[[caption]]
at_ms = 36_000
text = "The door stays open."
view = "fridge"

[[caption]]
at_ms = 93_000
text = "After 60 seconds the fridge raises a door alarm."
view = "fridge"

[[caption]]
at_ms = 101_000
text = "The door is closed. The alarm clears."
view = "fridge"

[[caption]]
at_ms = 110_000
text = "Mains fails. Cooling and lights stop. The battery keeps monitoring alive. Keep the door closed."
view = "fridge"

[[caption]]
at_ms = 122_000
text = "The safe time is not enough. The system advises transport."
view = "fridge"

[[caption]]
at_ms = 126_000
text = "Clinic B confirms it can receive."
view = "carrier"

[[caption]]
at_ms = 134_000
text = "Departure is refused. The box must hold 2 to 8 C for five minutes."
view = "carrier"

[[caption]]
at_ms = 150_000
text = "Meanwhile the batches are scanned into the box one by one."
view = "clinic"

[[caption]]
at_ms = 170_000
text = "Waiting for the box to prove itself stable."
view = "carrier"

[[caption]]
at_ms = 319_000
text = "Every condition holds. Departure is accepted."
view = "carrier"

[[caption]]
at_ms = 324_000
text = "The box leaves with its three batches."
view = "box"

[[caption]]
at_ms = 341_000
text = "On the way the box loses contact. It keeps recording."
view = "box"

[[caption]]
at_ms = 368_000
text = "At the clinic nobody can vouch for the batches. Use is refused."
view = "terminal"

[[caption]]
at_ms = 376_000
text = "The box reaches Clinic B."
view = "receiver"

[[caption]]
at_ms = 390_000
text = "Contact is back. Missed records follow in order."
view = "receiver"

[[caption]]
at_ms = 408_000
text = "The receiver signs for the box."
view = "receiver"

[[caption]]
at_ms = 419_000
text = "Use stays blocked until each batch is accepted."
view = "receiver"

[[caption]]
at_ms = 427_000
text = "The log is complete. Each batch is accepted."
view = "receiver"

[[caption]]
at_ms = 445_000
text = "All three batches arrived safe and fully recorded."
view = "receiver"

