# Expected environment. See Cargo.toml for the minimum Rust version.

[host]
# ID and VERSION_ID from /etc/os-release. CI builds and accepts each one.
os = ["ubuntu 22.04", "ubuntu 24.04", "ubuntu 26.04", "debian 12", "debian 13"]
arch = "x86_64"
min_free_disk_gib = 20
recommended_memory_gib = 8

[env]
# Child PATH overrides the shell PATH.
path = ["/usr/sbin", "/usr/bin", "/sbin", "/bin"]

[python]
# Used only by ESP-IDF build tools. Managed by uv.
version = "3.13.5"
min_uv = "0.8.4"

[esp_idf]
version = "v6.1.1"
url = "https://github.com/espressif/esp-idf.git"
commit = "051e4c4eb20346e043cdd47bc388fde75ff8af63"
targets = ["esp32s3", "esp32c3"]

[esp_emu]
version = "1.2.0"
url = "https://github.com/espressif/esp-emulator/releases/download/v1.2.0/esp-emu-1.2.0-x86_64-unknown-linux-gnu.tar.gz"
archive_sha256 = "560236344fd69dc8d74bc862c79aea01f7a69ac626ae3f54b1b0946bbce078c1"
binary_sha256 = "fe6b910f921772eed06969b57db02903c5f404a2f2a11dee116a857d4cdc3a2f"

[dozen]
# Mesa Vulkan driver on D3D12. WSL has no other Vulkan driver for the GPU,
# so the viewer renders on the CPU without it. Built only when /dev/dxg exists.
version = "25.2.8"
url = "https://archive.mesa3d.org/mesa-25.2.8.tar.xz"
archive_sha256 = "097842f3e49d996868b38688db87b006f7d4541e93ce86d2f341d8b3e7be7c93"
# Build tools run through uv.
python = ["meson==1.8.1", "mako==1.4.3", "pyyaml==6.0.4", "packaging==26.4"]
# Required only on WSL.
apt = [
    "libx11-xcb-dev",
    "libxcb-dri3-dev",
    "libxcb-keysyms1-dev",
    "libxcb-present-dev",
    "libxcb-randr0-dev",
    "libxcb-shm0-dev",
    "libxcb-sync-dev",
    "libxcb-xfixes0-dev",
    "libxrandr-dev",
    "libxshmfence-dev",
    "pkg-config",
]

[mqtt]
port = 1884

[apt]
# Package = minimum version. Empty means any version.
bison = ""
build-essential = ""
ca-certificates = ""
ccache = ""
cmake = "3.22.1"
curl = ""
# Encodes scenario videos with libx264.
ffmpeg = ""
flex = ""
git = ""
gperf = ""
libffi-dev = ""
libssl-dev = ""
"libusb-1.0-0" = ""
mosquitto = "2.0"
mosquitto-clients = "2.0"
ninja-build = ""
