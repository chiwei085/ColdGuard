[workspace]
members = ["crates/*"]
# Plain cargo run starts the CLI.
default-members = ["crates/coldguard"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"

# Keep simulation and rendering smooth in development.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
