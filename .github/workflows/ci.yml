name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: clang-format-18 --dry-run --Werror firmware/node/main/*.[ch] firmware/smoke/main/*.c

  # Every distro that toolchain.toml claims, so the claim cannot drift.
  distros:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.os.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: os
        shell: python
        run: |
          import json, os, tomllib
          with open("toolchain.toml", "rb") as f:
              images = [o.replace(" ", ":") for o in tomllib.load(f)["host"]["os"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"images={json.dumps(images)}\n")

  host:
    needs: distros
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.distros.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk for the 20 GiB doctor check
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
      - run: docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }} scripts/ci
